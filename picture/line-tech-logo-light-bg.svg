<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="swooshGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E3D"/>
      <stop offset="100%" stop-color="#1565D8"/>
    </linearGradient>
    <linearGradient id="techGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#29ABE2"/>
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect x="0" y="0" width="900" height="300" fill="#FFFFFF"/>

  <!-- swoosh (arc reseau/mouvement) -->
  <path d="M 40 170 A 110 110 0 0 1 220 90" fill="none" stroke="url(#swooshGradL)" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  <path d="M 60 185 A 90 90 0 0 1 210 75" fill="none" stroke="url(#swooshGradL)" stroke-width="10" stroke-linecap="round"/>

  <!-- icone wifi -->
  <g stroke="#1565D8" fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M 130 118 A 60 60 0 0 1 230 118"/>
    <path d="M 150 138 A 34 34 0 0 1 210 138"/>
  </g>
  <circle cx="180" cy="160" r="7" fill="#1565D8"/>

  <!-- icone camera (style vectoriel epure) -->
  <rect x="105" y="168" width="150" height="66" rx="16" fill="#0B1E3D"/>
  <rect x="245" y="188" width="22" height="26" rx="6" fill="#0B1E3D"/>
  <circle cx="180" cy="201" r="30" fill="#1565D8"/>
  <circle cx="180" cy="201" r="18" fill="#0B1E3D"/>
  <circle cx="172" cy="193" r="5" fill="#4FB7EC"/>

  <!-- wordmark -->
  <text x="320" y="150" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="76" fill="#0B1E3D" letter-spacing="1">LINE<tspan fill="url(#techGradL)"> TECH</tspan></text>

  <!-- ligne separatrice -->
  <line x1="322" y1="180" x2="780" y2="180" stroke="#B9C6D8" stroke-width="2"/>

  <!-- sous-titre -->
  <text x="320" y="215" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="26" fill="#1565D8" letter-spacing="7">LINE TECHNOLOGY</text>

  <!-- baseline -->
  <text x="320" y="248" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="18" fill="#4B5A70" letter-spacing="1">Experts en securite electronique &amp; reseaux informatiques</text>
</svg>
